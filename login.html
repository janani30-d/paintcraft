<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>

    <!-- =========================================================
         META
    ========================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="PaintCraft - Professional Painting & Home Renovation Services"
    >

    <meta
        name="keywords"
        content="painting, home renovation, interior painting, exterior painting, waterproofing"
    >

    <meta
        name="author"
        content="PaintCraft"
    >

    <title>PaintCraft | Painting & Renovation</title>
<link
    rel="icon"
    type="image/png"
    href="images/logo.png"
>

    <!-- =========================================================
         GOOGLE FONT
         Inter - Used Consistently Throughout Website
    ========================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================================
         FONT AWESOME
    ========================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- =========================================================
         MAIN CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- =========================================================
         RESPONSIVE CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body>


<!-- =========================================================
     PAINTCRAFT AUTH CONTROLS
========================================================= -->

<div class="auth-controls">

    <!-- DARK MODE -->
    <button
        type="button"
        class="auth-control-btn"
        id="paintcraftDarkModeBtn"
        aria-label="Toggle dark mode"
        title="Dark mode"
    >
        <i class="fas fa-moon"></i>
    </button>

    <!-- RTL MODE -->
    <button
        type="button"
        class="auth-control-btn"
        id="paintcraftRtlBtn"
        aria-label="Toggle RTL mode"
        title="RTL mode"
    >
        <i class="fas fa-right-left"></i>
    </button>

</div>


<!-- =========================================================
     PAINTCRAFT LOGIN PAGE
========================================================= -->

<main class="paintcraft-login-page">

    <section class="paintcraft-login-section">

        <div class="paintcraft-login-container">

            <!-- =================================================
                 LOGIN CARD
            ================================================== -->

            <div class="paintcraft-login-card">


                <!-- =================================================
                     LOGO
                ================================================== -->

                <div class="paintcraft-login-logo">

                    <a href="index.html">

                        <img
                            src="images/logo.png"
                            alt="PaintCraft"
                        >

                    </a>

                </div>


                <!-- =================================================
                     LOGIN HEADER
                ================================================== -->

                <div class="paintcraft-login-header">

                    <span class="paintcraft-login-eyebrow">
                        WELCOME BACK
                    </span>

                    <h1 class="paintcraft-login-title">
                        Sign In to PaintCraft
                    </h1>

                    <p class="paintcraft-login-description">
                        Sign in to access your account, manage your
                        artwork, and continue your creative journey.
                    </p>

                </div>


                <!-- =================================================
                     LOGIN FORM
                ================================================== -->

                <form
                    class="paintcraft-login-form"
                    id="paintcraftLoginForm"
                >

                    <!-- EMAIL -->

                    <div class="paintcraft-login-form-group">

                        <label for="paintcraft-login-email">
                            Email Address
                        </label>

                        <div class="paintcraft-login-input-wrapper">

                            <i class="fas fa-envelope"></i>

                            <input
                                type="email"
                                id="paintcraft-login-email"
                                name="email"
                                placeholder="Enter your email address"
                                autocomplete="email"
                                required
                            >

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div class="paintcraft-login-form-group">

                        <div class="paintcraft-login-label-row">

                            <label for="paintcraft-login-password">
                                Password
                            </label>

                            

                        </div>

                        <div class="paintcraft-login-input-wrapper">

                            <i class="fas fa-lock"></i>

                            <input
                                type="password"
                                id="paintcraft-login-password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="paintcraft-login-password-toggle"
                                aria-label="Show password"
                            >
                                <i class="fas fa-eye"></i>
                            </button>
                            <a
                                href="#forgot-password"
                                class="paintcraft-login-forgot-link"
                            >
                                Forgot Password?
                            </a>

                        </div>

                    </div>


                    <!-- =================================================
                         REMEMBER ME
                    ================================================== -->

                    <div class="paintcraft-login-options">

                        <label class="paintcraft-login-remember">

                            <input
                                type="checkbox"
                                id="paintcraft-remember-me"
                                name="remember"
                            >

                            <span class="paintcraft-login-checkbox"></span>

                            <span>
                                Remember me
                            </span>

                        </label>

                    </div>


                    <!-- =================================================
                         SUBMIT BUTTON
                    ================================================== -->

                    <button
                        type="submit"
                        class="paintcraft-login-submit-btn"
                    >

                        <span>
                            Sign In
                        </span>

                        <i class="fas fa-arrow-right"></i>

                    </button>

                </form>


                <!-- =================================================
                     DIVIDER
                ================================================== -->

                <div class="paintcraft-login-divider">

                    <span>
                        or continue with
                    </span>

                </div>


                <!-- =================================================
                     SOCIAL LOGIN
                ================================================== -->

                <div class="paintcraft-login-social">


                    <!-- =================================================
                         GOOGLE
                    ================================================== -->

                    <a
                        href="#"
                        class="paintcraft-login-social-btn paintcraft-login-google"
                        aria-label="Continue with Google"
                    >

                        <svg
                            class="paintcraft-google-logo"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M21.35 12.27c0-.71-.06-1.4-.18-2.06H12v3.9h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.23Z"
                                fill="#4285F4"
                            />

                            <path
                                d="M12 21.67c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.74 9.74 0 0 0 12 21.67Z"
                                fill="#34A853"
                            />

                            <path
                                d="M6.54 13.76A5.85 5.85 0 0 1 6.23 12c0-.61.11-1.2.31-1.76V7.71H3.3A9.72 9.72 0 0 0 2.27 12c0 1.57.38 3.05 1.03 4.29l3.24-2.53Z"
                                fill="#FBBC05"
                            />

                            <path
                                d="M12 6.21c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.29 14.63 2.33 12 2.33a9.74 9.74 0 0 0-8.7 5.38l3.24 2.53C7.31 7.93 9.46 6.21 12 6.21Z"
                                fill="#EA4335"
                            />

                        </svg>

                        <span>
                            Google
                        </span>

                    </a>


                    <!-- =================================================
                         FACEBOOK
                    ================================================== -->

                    <a
                        href="#"
                        class="paintcraft-login-social-btn paintcraft-login-facebook"
                        aria-label="Continue with Facebook"
                    >

                        <i class="fab fa-facebook-f"></i>

                        <span>
                            Facebook
                        </span>

                    </a>


                    <!-- =================================================
                         APPLE
                    ================================================== -->

                    <a
                        href="#"
                        class="paintcraft-login-social-btn paintcraft-login-apple"
                        aria-label="Continue with Apple"
                    >

                        <i class="fab fa-apple"></i>

                        <span>
                            Apple
                        </span>

                    </a>

                </div>


                <!-- =================================================
                     REGISTER
                ================================================== -->

                <div class="paintcraft-login-register">

                    <span>
                        Don't have an account?
                    </span>

                    <a href="register.html">
                        Create an Account
                    </a>

                </div>

            </div>

        </div>

    </section>

</main>


<!-- =========================================================
     PAINTCRAFT LOGIN SCRIPT
========================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    /* =========================================================
       PASSWORD VISIBILITY
    ========================================================= */

    const passwordInput =
        document.getElementById("paintcraft-login-password");

    const passwordToggle =
        document.querySelector(
            ".paintcraft-login-password-toggle"
        );

    if (passwordToggle && passwordInput) {

        passwordToggle.addEventListener("click", function () {

            const isPassword =
                passwordInput.type === "password";

            passwordInput.type =
                isPassword ? "text" : "password";

            const icon =
                passwordToggle.querySelector("i");

            if (icon) {

                icon.classList.toggle(
                    "fa-eye",
                    !isPassword
                );

                icon.classList.toggle(
                    "fa-eye-slash",
                    isPassword
                );

            }

            passwordToggle.setAttribute(
                "aria-label",
                isPassword
                    ? "Hide password"
                    : "Show password"
            );

        });

    }


    /* =========================================================
       LOGIN FORM
    ========================================================= */

    const loginForm =
        document.getElementById("paintcraftLoginForm");

    if (loginForm) {

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            /*
             * Add your authentication logic here.
             */

        });

    }


    /* =========================================================
       DARK MODE
    ========================================================= */

    const darkModeBtn =
        document.getElementById("paintcraftDarkModeBtn");

    if (darkModeBtn) {

        darkModeBtn.addEventListener("click", function () {

            document.body.classList.toggle("dark-mode");

        });

    }


    /* =========================================================
       RTL MODE
    ========================================================= */

    const rtlBtn =
        document.getElementById("paintcraftRtlBtn");

    if (rtlBtn) {

        rtlBtn.addEventListener("click", function () {

            const currentDirection =
                document.documentElement.getAttribute("dir");

            if (currentDirection === "rtl") {

                document.documentElement.setAttribute(
                    "dir",
                    "ltr"
                );

            } else {

                document.documentElement.setAttribute(
                    "dir",
                    "rtl"
                );

            }

        });

    }

});

</script>
